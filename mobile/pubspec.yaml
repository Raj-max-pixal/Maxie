name: maxie_mobile
description: MAXie, your AI companion.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  http: ^1.2.2
  flutter_overlay_window: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/avatars/
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/wallpapers/
