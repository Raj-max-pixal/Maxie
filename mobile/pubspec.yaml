name: maxie_mobile
description: MAXie Mobile - India's First AI Mobile Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_colorpicker: ^1.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Animations
  lottie: ^3.1.3
  rive: ^0.13.20
  flutter_svg: ^2.0.17

  # AI & Gemini
  google_generative_ai: ^0.4.6
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2

  # Voice
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Battery & System Info
  battery_plus: ^6.1.1
  device_info_plus: ^11.3.0
  flutter_background_service: ^5.1.0

  # Media & Audio
  audio_session: ^0.1.21
  just_audio: ^0.9.42

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Location & Weather
  geolocator: ^13.0.2
  weather: ^3.1.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  vibration: ^2.0.1
  sensors_plus: ^6.1.1
  connectivity_plus: ^6.1.1

  # Games & Physics
  confetti: ^0.8.0
  flame: ^1.23.0

  # Date & Time
  table_calendar: ^3.1.3
  flutter_datetime_picker_plus: ^2.4.0

  # Charts
  fl_chart: ^0.70.2

  # Overlay
  overlay_support: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/rive/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700