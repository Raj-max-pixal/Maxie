name: maxie_mobile
description: MAXie, your AI companion.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  http: ^1.2.2
  purchases_flutter: ^10.11.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  google_generative_ai: ^0.4.7
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  geolocator: ^14.0.3
  weather: ^3.2.1
  battery_plus: ^7.1.1
  confetti: ^0.8.0
  fl_chart: ^1.2.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  table_calendar: ^3.2.1
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/avatars/
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/wallpapers/
